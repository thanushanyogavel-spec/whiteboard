<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Canvas — a collaborative whiteboard</title>
<style>
  :root{
    --bg:#0e1014; --panel:#151920; --panel2:#1b2029; --line:#252c37;
    --fg:#e9eef5; --mute:#8b95a3; --dim:#5a6472;
    --acc:#5eead4; --acc2:#a78bfa; --danger:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:crosshair}
  #stage.pan{cursor:grabbing}
  #stage.select{cursor:default}

  /* toolbar */
  #bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;padding:7px;border-radius:16px;
    background:rgba(21,25,32,.92);border:1px solid var(--line);
    backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:20}
  .tool{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;
    border:1px solid transparent;background:transparent;color:var(--mute);cursor:pointer;transition:.14s}
  .tool:hover{background:var(--panel2);color:var(--fg)}
  .tool.on{background:color-mix(in oklab,var(--acc) 18%,transparent);border-color:color-mix(in oklab,var(--acc) 45%,transparent);color:var(--acc)}
  .tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
  #swatches{display:flex;gap:5px;padding:0 4px}
  .sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.14s}
  .sw:hover{transform:scale(1.15)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  #widths{display:flex;gap:4px;align-items:center;padding:0 4px}
  .wd{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;cursor:pointer;border:1px solid transparent}
  .wd:hover{background:var(--panel2)}
  .wd.on{background:color-mix(in oklab,var(--acc) 18%,transparent);border-color:color-mix(in oklab,var(--acc) 45%,transparent)}
  .wd i{display:block;border-radius:50%;background:var(--fg)}

  /* top-left panel */
  #hud{position:fixed;top:18px;left:18px;display:flex;gap:10px;align-items:center;z-index:20}
  .pill{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;
    background:rgba(21,25,32,.92);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:12.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .dot.off{background:var(--dim);box-shadow:none}
  #peers{display:flex;gap:-6px}
  .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;color:#08110f;margin-left:-7px;border:2px solid var(--panel)}
  .avatar:first-child{margin-left:0}

  /* top-right panel */
  #right{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:20}
  .btn{padding:9px 14px;border-radius:11px;background:rgba(21,25,32,.92);border:1px solid var(--line);
    color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer;backdrop-filter:blur(14px);transition:.14s}
  .btn:hover{border-color:#39424f;background:var(--panel2)}
  .btn.primary{background:var(--acc);color:#04211d;border-color:var(--acc);font-weight:650}
  .btn.primary:hover{background:#7ff0dc}

  /* modal */
  #modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(6,8,11,.72);
    backdrop-filter:blur(6px);z-index:60;padding:20px}
  #modal.show{display:grid}
  .sheet{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:24px}
  .sheet h2{margin:0 0 6px;font-size:18px;font-weight:650}
  .sheet p{margin:0 0 16px;color:var(--mute);font-size:13px;line-height:1.6}
  .sheet textarea{width:100%;height:110px;background:#0b0e12;border:1px solid var(--line);
    border-radius:11px;color:var(--fg);padding:11px;font:12px/1.5 ui-monospace,monospace;
    resize:vertical;outline:none}
  .sheet textarea:focus{border-color:var(--acc)}
  .row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:120px;text-align:center}

  /* text entry */
  #textEntry{position:fixed;display:none;z-index:30;background:transparent;border:none;
    outline:1px dashed var(--acc);color:var(--fg);font:inherit;padding:2px 4px;min-width:120px}
  #toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);
    padding:9px 16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
    font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<textarea id="textEntry" rows="1" spellcheck="false"></textarea>

<div id="hud">
  <div class="pill"><span class="dot" id="liveDot"></span><span id="liveText">live</span></div>
  <div class="pill" style="padding:6px 10px"><div id="peers"></div></div>
</div>

<div id="right">
  <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button class="btn" id="exportBtn">Export PNG</button>
  <button class="btn primary" id="shareBtn">Invite</button>
</div>

<div id="bar">
  <button class="tool on" data-tool="pen" title="Pen (P)">
    <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  </button>
  <button class="tool" data-tool="select" title="Select (V)">
    <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
  </button>
  <button class="tool" data-tool="rect" title="Rectangle (R)">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
  </button>
  <button class="tool" data-tool="ellipse" title="Ellipse (O)">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
  </button>
  <button class="tool" data-tool="line" title="Line (L)">
    <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
  </button>
  <button class="tool" data-tool="arrow" title="Arrow (A)">
    <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M11 5h8v8"/></svg>
  </button>
  <button class="tool" data-tool="text" title="Text (T)">
    <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
  </button>
  <button class="tool" data-tool="eraser" title="Eraser (E)">
    <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16a2 2 0 010-3l9-9a2 2 0 013 0l4 4a2 2 0 010 3l-7 7"/></svg>
  </button>
  <div class="sep"></div>
  <div id="swatches"></div>
  <div class="sep"></div>
  <div id="widths"></div>
</div>

<div id="modal">
  <div class="sheet">
    <h2>Collaborate</h2>
    <p id="modalDesc">Two ways to work with someone else.</p>
    <div id="modalBody"></div>
    <div class="row">
      <button class="btn" id="modalClose">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
"use strict";
/* ═══════════════════════════ state ═══════════════════════════ */
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
const textEntry = document.getElementById("textEntry");

const ME = {
  id: Math.random().toString(36).slice(2, 9),
  name: ["Ash","Birch","Cedar","Dune","Ember","Fern","Gale","Hazel"][Math.floor(Math.random()*8)],
  colour: ["#5eead4","#a78bfa","#fbbf24","#f472b6","#60a5fa","#4ade80"][Math.floor(Math.random()*6)],
};

const PALETTE = ["#e9eef5","#5eead4","#a78bfa","#fbbf24","#f87171","#60a5fa","#4ade80","#f472b6"];
const WIDTHS = [2, 4, 8, 14];

const state = {
  elements: new Map(),      // id -> element
  order: [],                // render order
  camera: { x: 0, y: 0, zoom: 1 },
  tool: "pen",
  colour: PALETTE[1],
  width: WIDTHS[1],
  selected: new Set(),
  peers: new Map(),         // id -> {name, colour, x, y, ts}
  undo: [],
  redo: [],
};

/* ═══════════════════════════ element model (LWW-CRDT) ═══════════════════════════ */
let clock = 0;
const stamp = () => (clock = Math.max(clock + 1, Date.now()));

function newElement(type, props) {
  return Object.assign({
    id: Math.random().toString(36).slice(2, 10),
    type, colour: state.colour, width: state.width,
    updatedAt: stamp(), author: ME.id, deleted: false,
  }, props);
}

/** last-writer-wins merge — the whole basis of convergence */
function merge(el) {
  const cur = state.elements.get(el.id);
  if (cur) {
    if (el.updatedAt < cur.updatedAt) return false;
    if (el.updatedAt === cur.updatedAt && el.author <= cur.author) return false;
  } else {
    state.order.push(el.id);
  }
  state.elements.set(el.id, el);
  return true;
}

function applyOp(op) {
  if (op.t === "upsert") return merge(op.el);
  if (op.t === "del") {
    const cur = state.elements.get(op.id);
    if (!cur) return false;
    if (op.updatedAt < cur.updatedAt) return false;
    cur.deleted = true; cur.updatedAt = op.updatedAt;
    return true;
  }
  return false;
}

function broadcast(op) {
  applyOp(op);
  if (chan) chan.postMessage({ kind: "op", op, from: ME.id });
  scheduleDraw();
}

/* ═══════════════════════════ rendering ═══════════════════════════ */
let dpr = 1, W = 0, H = 0, drawQueued = false;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  stage.width = W * dpr; stage.height = H * dpr;
  stage.style.width = W + "px"; stage.style.height = H + "px";
  scheduleDraw();
}
function scheduleDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}
const toWorld = (sx, sy) => ({
  x: (sx - state.camera.x) / state.camera.zoom,
  y: (sy - state.camera.y) / state.camera.zoom,
});

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0e1014";
  ctx.fillRect(0, 0, W, H);

  const { x, y, zoom } = state.camera;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(zoom, zoom);

  drawGrid(zoom);

  for (const id of state.order) {
    const el = state.elements.get(id);
    if (!el || el.deleted) continue;
    drawElement(el);
  }

  // selection halo
  for (const id of state.selected) {
    const el = state.elements.get(id);
    if (!el || el.deleted) continue;
    const b = bounds(el);
    if (!b) continue;
    ctx.strokeStyle = "#5eead4"; ctx.lineWidth = 1.5 / zoom;
    ctx.setLineDash([6 / zoom, 4 / zoom]);
    ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
    ctx.setLineDash([]);
  }

  // remote cursors
  const now = Date.now();
  for (const [, p] of state.peers) {
    if (now - p.ts > 6000 || p.x == null) continue;
    ctx.fillStyle = p.colour;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + 12 / zoom, p.y + 4 / zoom);
    ctx.lineTo(p.x + 4 / zoom, p.y + 12 / zoom);
    ctx.closePath(); ctx.fill();
    ctx.font = `${11 / zoom}px ui-sans-serif,system-ui`;
    const label = p.name;
    const w = ctx.measureText(label).width + 10 / zoom;
    ctx.globalAlpha = .9;
    ctx.fillRect(p.x + 12 / zoom, p.y + 8 / zoom, w, 16 / zoom);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#08110f";
    ctx.fillText(label, p.x + 17 / zoom, p.y + 19.5 / zoom);
  }

  ctx.restore();
}

function drawGrid(zoom) {
  const step = 32 * zoom;
  if (step < 12) return;
  const { x, y } = state.camera;
  ctx.strokeStyle = "rgba(255,255,255,0.028)";
  ctx.lineWidth = 1;
  const ox = ((x % step) + step) % step;
  const oy = ((y % step) + step) % step;
  ctx.beginPath();
  for (let gx = ox; gx < W; gx += step) { ctx.moveTo((gx - x) / zoom, (0 - y) / zoom); ctx.lineTo((gx - x) / zoom, (H - y) / zoom); }
  for (let gy = oy; gy < H; gy += step) { ctx.moveTo((0 - x) / zoom, (gy - y) / zoom); ctx.lineTo((W - x) / zoom, (gy - y) / zoom); }
  ctx.stroke();
}

function drawElement(el) {
  ctx.strokeStyle = el.colour;
  ctx.fillStyle = el.colour;
  ctx.lineWidth = el.width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (el.type === "path" && el.points && el.points.length) {
    ctx.beginPath();
    ctx.moveTo(el.points[0].x, el.points[0].y);
    for (let i = 1; i < el.points.length; i++) ctx.lineTo(el.points[i].x, el.points[i].y);
    if (el.points.length === 1) { ctx.arc(el.points[0].x, el.points[0].y, el.width / 2, 0, 7); ctx.fill(); }
    else ctx.stroke();
  } else if (el.type === "rect") {
    ctx.strokeRect(el.x, el.y, el.w, el.h);
  } else if (el.type === "ellipse") {
    ctx.beginPath();
    ctx.ellipse(el.x + el.w / 2, el.y + el.h / 2, Math.abs(el.w / 2), Math.abs(el.h / 2), 0, 0, 7);
    ctx.stroke();
  } else if (el.type === "line" || el.type === "arrow") {
    ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
    if (el.type === "arrow") {
      const a = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
      const L = Math.max(12, el.width * 3);
      ctx.beginPath();
      ctx.moveTo(el.x2, el.y2);
      ctx.lineTo(el.x2 - L * Math.cos(a - 0.4), el.y2 - L * Math.sin(a - 0.4));
      ctx.moveTo(el.x2, el.y2);
      ctx.lineTo(el.x2 - L * Math.cos(a + 0.4), el.y2 - L * Math.sin(a + 0.4));
      ctx.stroke();
    }
  } else if (el.type === "text") {
    ctx.font = `${el.fontSize}px ui-sans-serif,system-ui,sans-serif`;
    ctx.textBaseline = "top";
    ctx.fillText(el.text, el.x, el.y);
  }
}

function bounds(el) {
  if (el.type === "path" && el.points && el.points.length) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of el.points) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  if (el.type === "rect" || el.type === "ellipse") {
    return { x: Math.min(el.x, el.x + el.w), y: Math.min(el.y, el.y + el.h), w: Math.abs(el.w), h: Math.abs(el.h) };
  }
  if (el.type === "line" || el.type === "arrow") {
    return { x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2), w: Math.abs(el.x2 - el.x1), h: Math.abs(el.y2 - el.y1) };
  }
  if (el.type === "text") {
    return { x: el.x, y: el.y, w: el.text.length * el.fontSize * 0.55, h: el.fontSize };
  }
  return null;
}
/* ═══════════════════════════ interaction ═══════════════════════════ */
let drawing = null;       // element being built
let panning = null;       // {sx, sy, cx, cy}
let erasing = false;

stage.addEventListener("pointerdown", (e) => {
  stage.setPointerCapture(e.pointerId);
  const w = toWorld(e.clientX, e.clientY);

  // pan with space, middle button, or two-finger
  if (e.button === 1 || spaceDown || (state.tool === "select" && e.shiftKey)) {
    panning = { sx: e.clientX, sy: e.clientY, cx: state.camera.x, cy: state.camera.y };
    stage.classList.add("pan");
    return;
  }

  if (state.tool === "select") {
    const hit = hitTest(w);
    state.selected.clear();
    if (hit) state.selected.add(hit.id);
    scheduleDraw();
    return;
  }

  if (state.tool === "eraser") { erasing = true; eraseAt(w); return; }

  if (state.tool === "text") { startTextEntry(e.clientX, e.clientY, w); return; }

  if (state.tool === "pen") {
    drawing = newElement("path", { points: [{ x: w.x, y: w.y }] });
  } else if (state.tool === "rect" || state.tool === "ellipse") {
    drawing = newElement(state.tool, { x: w.x, y: w.y, w: 0, h: 0 });
  } else if (state.tool === "line" || state.tool === "arrow") {
    drawing = newElement(state.tool, { x1: w.x, y1: w.y, x2: w.x, y2: w.y });
  }
  if (drawing) scheduleDraw();
});

stage.addEventListener("pointermove", (e) => {
  const w = toWorld(e.clientX, e.clientY);
  if (chan && Math.random() < 0.5) {
    chan.postMessage({ kind: "cursor", from: ME.id, name: ME.name, colour: ME.colour, x: w.x, y: w.y });
  }
  if (panning) {
    state.camera.x = panning.cx + (e.clientX - panning.sx);
    state.camera.y = panning.cy + (e.clientY - panning.sy);
    scheduleDraw(); return;
  }
  if (erasing) { eraseAt(w); return; }
  if (!drawing) return;

  if (drawing.type === "path") drawing.points.push({ x: w.x, y: w.y });
  else if (drawing.type === "rect" || drawing.type === "ellipse") { drawing.w = w.x - drawing.x; drawing.h = w.y - drawing.y; }
  else { drawing.x2 = w.x; drawing.y2 = w.y; }
  scheduleDraw();
});

function endStroke() {
  if (panning) { panning = null; stage.classList.remove("pan"); return; }
  erasing = false;
  if (!drawing) return;
  drawing.updatedAt = stamp();
  broadcast({ t: "upsert", el: drawing });
  pushUndo({ t: "upsert", el: drawing });
  drawing = null;
  scheduleDraw();
}
stage.addEventListener("pointerup", endStroke);
stage.addEventListener("pointercancel", endStroke);

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const before = toWorld(e.clientX, e.clientY);
    const factor = Math.exp(-e.deltaY * 0.0022);
    state.camera.zoom = Math.min(6, Math.max(0.15, state.camera.zoom * factor));
    const after = toWorld(e.clientX, e.clientY);
    state.camera.x += (after.x - before.x) * state.camera.zoom;
    state.camera.y += (after.y - before.y) * state.camera.zoom;
  } else {
    state.camera.x -= e.deltaX;
    state.camera.y -= e.deltaY;
  }
  scheduleDraw();
}, { passive: false });

function hitTest(w) {
  for (let i = state.order.length - 1; i >= 0; i--) {
    const el = state.elements.get(state.order[i]);
    if (!el || el.deleted) continue;
    const b = bounds(el);
    if (!b) continue;
    const pad = 8;
    if (w.x >= b.x - pad && w.x <= b.x + b.w + pad && w.y >= b.y - pad && w.y <= b.y + b.h + pad) return el;
  }
  return null;
}

function eraseAt(w) {
  const hit = hitTest(w);
  if (!hit) return;
  const op = { t: "del", id: hit.id, updatedAt: stamp() };
  broadcast(op);
  pushUndo(op);
}

/* ═══════════════════════════ text entry ═══════════════════════════ */
let textAt = null;
function startTextEntry(sx, sy, world) {
  textAt = world;
  textEntry.style.display = "block";
  textEntry.style.left = sx + "px";
  textEntry.style.top = sy + "px";
  textEntry.style.color = state.colour;
  textEntry.style.fontSize = (22 * state.camera.zoom) + "px";
  textEntry.value = "";
  textEntry.focus();
}
textEntry.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitText(); }
  if (e.key === "Escape") { textEntry.style.display = "none"; textAt = null; }
});
textEntry.addEventListener("blur", commitText);
function commitText() {
  const txt = textEntry.value.trim();
  textEntry.style.display = "none";
  if (!txt || !textAt) { textAt = null; return; }
  const el = newElement("text", { x: textAt.x, y: textAt.y, text: txt, fontSize: 22 });
  broadcast({ t: "upsert", el });
  pushUndo({ t: "upsert", el });
  textAt = null;
}

/* ═══════════════════════════ undo / redo ═══════════════════════════ */
function pushUndo(op) { state.undo.push(op); if (state.undo.length > 200) state.undo.shift(); state.redo.length = 0; }

function undo() {
  const op = state.undo.pop();
  if (!op) return;
  if (op.t === "upsert") {
    const el = state.elements.get(op.el.id);
    if (el) { el.deleted = true; el.updatedAt = stamp(); broadcast({ t: "del", id: el.id, updatedAt: el.updatedAt }); }
  } else if (op.t === "del") {
    const el = state.elements.get(op.id);
    if (el) { el.deleted = false; el.updatedAt = stamp(); broadcast({ t: "upsert", el }); }
  }
  state.redo.push(op);
}

function redo() {
  const op = state.redo.pop();
  if (!op) return;
  if (op.t === "upsert") {
    const el = state.elements.get(op.el.id);
    if (el) { el.deleted = false; el.updatedAt = stamp(); broadcast({ t: "upsert", el }); }
  } else if (op.t === "del") {
    const el = state.elements.get(op.id);
    if (el) { el.deleted = true; el.updatedAt = stamp(); broadcast({ t: "del", id: el.id, updatedAt: el.updatedAt }); }
  }
  state.undo.push(op);
}

/* ═══════════════════════════ sync: BroadcastChannel ═══════════════════════════ */
let chan = null;
function snapshot() {
  return state.order.map((id) => state.elements.get(id)).filter(Boolean);
}

if ("BroadcastChannel" in window) {
  chan = new BroadcastChannel("canvas-whiteboard");
  chan.onmessage = (e) => {
    const m = e.data;
    if (!m || m.from === ME.id) return;
    if (m.kind === "hello") {
      chan.postMessage({ kind: "state", from: ME.id, els: snapshot(),
        peer: { id: ME.id, name: ME.name, colour: ME.colour } });
    } else if (m.kind === "state") {
      let changed = false;
      for (const el of m.els) if (merge(el)) changed = true;
      if (m.peer) state.peers.set(m.peer.id, { ...m.peer, ts: Date.now() });
      if (changed) scheduleDraw();
      renderPeers();
    } else if (m.kind === "op") {
      if (applyOp(m.op)) scheduleDraw();
    } else if (m.kind === "cursor") {
      state.peers.set(m.from, { id: m.from, name: m.name, colour: m.colour, x: m.x, y: m.y, ts: Date.now() });
      renderPeers(); scheduleDraw();
    }
  };
  chan.postMessage({ kind: "hello", from: ME.id });
  setInterval(() => {
    const now = Date.now();
    for (const [id, p] of state.peers) if (now - p.ts > 7000) state.peers.delete(id);
    renderPeers(); scheduleDraw();
  }, 2500);
}

function renderPeers() {
  const box = document.getElementById("peers");
  box.innerHTML = "";
  const all = [{ id: ME.id, name: ME.name + " (you)", colour: ME.colour }, ...state.peers.values()];
  for (const p of all) {
    const a = document.createElement("div");
    a.className = "avatar";
    a.style.background = p.colour;
    a.textContent = (p.name || "?").slice(0, 2).toUpperCase();
    a.title = p.name;
    box.appendChild(a);
  }
  const live = document.getElementById("liveText");
  const dot = document.getElementById("liveDot");
  if (state.peers.size) { live.textContent = (state.peers.size + 1) + " online"; dot.classList.remove("off"); }
  else { live.textContent = "live · just you"; dot.classList.add("off"); }
}
/* ═══════════════════════════ sync: WebRTC (no server) ═══════════════════════════ */
let pc = null, dc = null;

function rtcHandle(m) {
  if (m.kind === "hello") {
    send({ kind: "state", from: ME.id, els: snapshot(), peer: { id: ME.id, name: ME.name, colour: ME.colour } });
  } else if (m.kind === "state") {
    let changed = false;
    for (const el of m.els) if (merge(el)) changed = true;
    if (m.peer) state.peers.set(m.peer.id, { ...m.peer, ts: Date.now() });
    if (changed) scheduleDraw();
    renderPeers();
  } else if (m.kind === "op") {
    if (applyOp(m.op)) scheduleDraw();
  } else if (m.kind === "cursor") {
    state.peers.set(m.from, { id: m.from, name: m.name, colour: m.colour, x: m.x, y: m.y, ts: Date.now() });
    renderPeers(); scheduleDraw();
  }
}

function send(obj) { if (dc && dc.readyState === "open") dc.send(JSON.stringify(obj)); }

function wireChannel(channel) {
  dc = channel;
  dc.onopen = () => {
    toast("Peer connected");
    send({ kind: "hello", from: ME.id });
    document.getElementById("liveDot").classList.remove("off");
  };
  dc.onmessage = (e) => { try { rtcHandle(JSON.parse(e.data)); } catch {} };
  dc.onclose = () => toast("Peer disconnected");
}

function newPeer() {
  if (pc) { try { pc.close(); } catch {} }
  pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  pc.onconnectionstatechange = () => {
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      document.getElementById("liveDot").classList.add("off");
    }
  };
  return pc;
}

const b64 = {
  enc: (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))),
  dec: (s) => JSON.parse(decodeURIComponent(escape(atob(s.trim())))),
};

async function waitIce(peer) {
  if (peer.iceGatheringState === "complete") return;
  await new Promise((res) => {
    const t = setTimeout(res, 3500);
    peer.addEventListener("icegatheringstatechange", () => {
      if (peer.iceGatheringState === "complete") { clearTimeout(t); res(); }
    });
  });
}

/* ═══════════════════════════ UI ═══════════════════════════ */
const swatchBox = document.getElementById("swatches");
PALETTE.forEach((c, i) => {
  const b = document.createElement("div");
  b.className = "sw" + (i === 1 ? " on" : "");
  b.style.background = c;
  b.onclick = () => {
    state.colour = c;
    [...swatchBox.children].forEach((n) => n.classList.remove("on"));
    b.classList.add("on");
  };
  swatchBox.appendChild(b);
});

const widthBox = document.getElementById("widths");
WIDTHS.forEach((w, i) => {
  const b = document.createElement("div");
  b.className = "wd" + (i === 1 ? " on" : "");
  const dot = document.createElement("i");
  dot.style.width = dot.style.height = Math.min(16, w + 3) + "px";
  b.appendChild(dot);
  b.onclick = () => {
    state.width = w;
    [...widthBox.children].forEach((n) => n.classList.remove("on"));
    b.classList.add("on");
  };
  widthBox.appendChild(b);
});

document.querySelectorAll(".tool").forEach((btn) => {
  btn.onclick = () => setTool(btn.dataset.tool);
});
function setTool(t) {
  state.tool = t;
  document.querySelectorAll(".tool").forEach((b) => b.classList.toggle("on", b.dataset.tool === t));
  stage.className = t === "select" ? "select" : "";
}

let spaceDown = false;
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { spaceDown = true; }
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
  const map = { p: "pen", v: "select", r: "rect", o: "ellipse", l: "line", a: "arrow", t: "text", e: "eraser" };
  if (map[k] && !e.ctrlKey && !e.metaKey) setTool(map[k]);
});
window.addEventListener("keyup", (e) => { if (e.code === "Space") spaceDown = false; });

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;
document.getElementById("exportBtn").onclick = exportPNG;

function exportPNG() {
  const tmp = document.createElement("canvas");
  tmp.width = W * dpr; tmp.height = H * dpr;
  const t = tmp.getContext("2d");
  t.setTransform(dpr, 0, 0, dpr, 0, 0);
  t.fillStyle = "#0e1014"; t.fillRect(0, 0, W, H);
  t.save(); t.translate(state.camera.x, state.camera.y); t.scale(state.camera.zoom, state.camera.zoom);
  for (const id of state.order) { const el = state.elements.get(id); if (el && !el.deleted) drawElement(el); }
  t.restore();
  const a = document.createElement("a");
  a.download = "whiteboard-" + Date.now() + ".png";
  a.href = tmp.toDataURL("image/png");
  a.click();
  toast("Exported PNG");
}

/* ── invite modal ── */
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modalBody");
document.getElementById("modalClose").onclick = () => modal.classList.remove("show");
document.getElementById("shareBtn").onclick = openInvite;

function openInvite() {
  modal.classList.add("show");
  modalBody.innerHTML = `
    <p style="margin:0 0 10px;font-size:12.5px;color:var(--mute)">
      <b style="color:var(--acc)">Same browser:</b> open this page in another tab — it syncs instantly, no setup.
    </p>
    <p style="margin:0 0 10px;font-size:12.5px;color:var(--mute)">
      <b style="color:var(--acc2)">Another device:</b> connect peer-to-peer below. No server, no account.
    </p>
    <div class="row">
      <button class="btn" id="hostBtn">Host a session</button>
      <button class="btn" id="joinBtn">Join a session</button>
    </div>
    <div id="rtcOut" style="margin-top:12px"></div>`;
  document.getElementById("hostBtn").onclick = hostSession;
  document.getElementById("joinBtn").onclick = joinSession;
}

async function hostSession() {
  const peer = newPeer();
  wireChannel(peer.createDataChannel("wb"));
  const offer = await peer.createOffer();
  await peer.setLocalDescription(offer);
  await waitIce(peer);
  const code = b64.enc(peer.localDescription);
  showRTC(`<p style="margin:0 0 6px;font-size:12px;color:var(--mute)">1. Send this to them:</p>
    <textarea id="outCode" readonly>${code}</textarea>
    <p style="margin:10px 0 6px;font-size:12px;color:var(--mute)">2. Paste their reply here:</p>
    <textarea id="inCode" placeholder="paste answer..."></textarea>
    <div class="row"><button class="btn primary" id="acceptBtn">Connect</button></div>`);
  document.getElementById("acceptBtn").onclick = async () => {
    try {
      await peer.setRemoteDescription(b64.dec(document.getElementById("inCode").value));
      toast("Connecting…");
    } catch (err) { toast("Bad code"); }
  };
}

async function joinSession() {
  showRTC(`<p style="margin:0 0 6px;font-size:12px;color:var(--mute)">Paste their invite code:</p>
    <textarea id="inCode" placeholder="paste invite..."></textarea>
    <div class="row"><button class="btn primary" id="mkBtn">Generate reply</button></div>`);
  document.getElementById("mkBtn").onclick = async () => {
    const peer = newPeer();
    peer.ondatachannel = (e) => wireChannel(e.channel);
    try {
      await peer.setRemoteDescription(b64.dec(document.getElementById("inCode").value));
      const ans = await peer.createAnswer();
      await peer.setLocalDescription(ans);
      await waitIce(peer);
      showRTC(`<p style="margin:0 0 6px;font-size:12px;color:var(--mute)">Send this back to them:</p>
        <textarea id="outCode" readonly>${b64.enc(peer.localDescription)}</textarea>`);
    } catch (err) { toast("Bad code"); }
  };
}

function showRTC(html) {
  document.getElementById("rtcOut").innerHTML = html;
  const out = document.getElementById("outCode");
  if (out) { out.focus(); out.select(); }
}

/* ── toast ── */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

/* ═══════════════════════════ boot ═══════════════════════════ */
window.addEventListener("resize", resize);
resize();
renderPeers();
setTool("pen");
window.whiteboard = { state, snapshot, merge, applyOp, ME };   // exposed for testing
</script>
